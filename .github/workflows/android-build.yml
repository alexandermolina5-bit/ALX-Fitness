name: Compilar ALX Fitness

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verificar recursos visuales integrados
        run: |
          test "$(find app/src/main/res/drawable-nodpi -name 'alx_*.webp' | wc -l)" -ge 60
          test "$(find app/src/main/res/drawable-nodpi -name 'routine_*.webp' | wc -l)" -ge 5
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALX-Fitness-5.4-Visual-Corregido-APK
          path: app/build/outputs/apk/debug/app-debug.apk
